<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scratch Workbench</title>
<style>
  :root { --bg: #16171d; --panel: #1f2129; --line: #30333f; --fg: #e6e7ee; --muted: #9a9db0; --accent: #4cbf56; --stop: #ec5959; --warn: #f2b53a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
  select, button, label { font: inherit; color: var(--fg); }
  select { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; min-width: 0; max-width: 100%; }
  button { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 5px 12px; cursor: pointer; }
  button:hover, button:focus-visible { border-color: var(--muted); outline: none; }
  #go { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  #stop { border-color: var(--stop); color: var(--stop); }
  label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  #status { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  #status.error { color: var(--stop); } #status.busy { color: var(--warn); }
  main { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; align-items: flex-start; }
  #stage { width: min(720px, 100%); aspect-ratio: 4 / 3; background: #000; border: 1px solid var(--line); }
  aside { flex: 1 1 260px; min-width: 0; display: grid; gap: 12px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-width: 0; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 8px; }
  table { width: 100%; border-collapse: collapse; font: 12px ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; }
  td { padding: 2px 4px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  td:first-child { color: var(--muted); width: 40%; }
  pre { margin: 0; font: 12px ui-monospace, Consolas, monospace; white-space: pre-wrap; max-height: 300px; overflow: auto; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Scratch Workbench</h1>
  <select id="project" aria-label="Project"></select>
  <button id="go" type="button">Green flag</button>
  <button id="stop" type="button">Stop</button>
  <label><input id="autostart" type="checkbox" checked> Start after rebuild</label>
  <span id="status">Loading…</span>
</header>
<main>
  <div id="stage"></div>
  <aside>
    <section><h2>Variables</h2><table id="vars"></table></section>
    <section id="log-box" hidden><h2>Build output</h2><pre id="log"></pre></section>
  </aside>
</main>
<script src="/scaffolding-min.js"></script>
<script src="/player.js"></script>
</body>
</html>
